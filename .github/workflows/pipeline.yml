name: pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 15 * *"   # monthly, after NHS England's second-Thursday publication

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Download NHS England data, run checks, build outputs
        run: python run_pipeline.py

      - name: Commit refreshed data and outputs
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw outputs docs
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Refresh NHS A&E data and outputs [automated]"
            git push
          fi
